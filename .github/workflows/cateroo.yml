name: Run Cateroo

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    environment: cateroo

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run cateroo
        env:
          CATEROO_URL: ${{ vars.CATEROO_URL }}
          CATEROO_USER: ${{ vars.CATEROO_USER }}
          CATEROO_PASSWORD: ${{ secrets.CATEROO_PASSWORD }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_OBJECT_KEY: ${{ vars.R2_OBJECT_KEY }}
        run: uv run cateroo
