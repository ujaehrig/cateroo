name: Run Cateroo

on:
  schedule:
    # Daily at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run cateroo
        env:
          CATEROO_URL: ${{ secrets.CATEROO_URL }}
          CATEROO_USER: ${{ secrets.CATEROO_USER }}
          CATEROO_PASSWORD: ${{ secrets.CATEROO_PASSWORD }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_OBJECT_KEY: ${{ secrets.R2_OBJECT_KEY }}
        run: uv run cateroo
